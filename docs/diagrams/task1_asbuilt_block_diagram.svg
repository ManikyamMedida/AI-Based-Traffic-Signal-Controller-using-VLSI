<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Arial, Helvetica, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="980" height="600" fill="#fff"/>
<text x="490" y="24" text-anchor="middle" font-size="16" font-weight="bold">AMTGC - As-Built Top-Level Block Diagram (amtgc_top)</text>
<rect x="10" y="40" width="960" height="545" fill="none" stroke="#555" stroke-dasharray="6 4"/>
<text x="20" y="58" fill="#555">amtgc_top  (single clk, active-high synchronous rst)</text>

<!-- Junction A -->
<rect x="60" y="90" width="300" height="190" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="210" y="110" text-anchor="middle" font-weight="bold">junction_controller  u_junc_A (reference)</text>
<rect x="80" y="125" width="260" height="85" fill="#fff" stroke="#1f5fa8"/>
<text x="210" y="143" text-anchor="middle">Moore FSM (7 states)</text>
<text x="210" y="160" text-anchor="middle" font-size="11">green_target(density) = clamp(GREEN_TIME +</text>
<text x="210" y="175" text-anchor="middle" font-size="11">density x GREEN_EXT_STEP, MIN, MAX)</text>
<text x="210" y="195" text-anchor="middle" font-size="11">sampled once at green start</text>
<rect x="80" y="222" width="260" height="46" fill="#fff" stroke="#1f5fa8"/>
<text x="210" y="240" text-anchor="middle">generic_timer  u_timer</text>
<text x="210" y="256" text-anchor="middle" font-size="11">start / count_target -> done (unchanged since Task 2)</text>

<!-- Junction B -->
<rect x="620" y="90" width="300" height="190" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="770" y="110" text-anchor="middle" font-weight="bold">junction_controller  u_junc_B (follower)</text>
<rect x="640" y="125" width="260" height="85" fill="#fff" stroke="#1f5fa8"/>
<text x="770" y="143" text-anchor="middle">Moore FSM (7 states)</text>
<text x="770" y="160" text-anchor="middle" font-size="11">same RTL, different parameters</text>
<text x="770" y="175" text-anchor="middle" font-size="11">density calc inside controller</text>
<rect x="640" y="222" width="260" height="46" fill="#fff" stroke="#1f5fa8"/>
<text x="770" y="240" text-anchor="middle">generic_timer  u_timer</text>
<text x="770" y="256" text-anchor="middle" font-size="11">start / count_target -> done</text>

<!-- Arbiter -->
<rect x="380" y="330" width="220" height="80" fill="#fdf1e3" stroke="#b36b00" stroke-width="1.5"/>
<text x="490" y="355" text-anchor="middle" font-weight="bold">ped_arbiter</text>
<text x="490" y="373" text-anchor="middle" font-size="11">round-robin, held grant</text>
<text x="490" y="389" text-anchor="middle" font-size="11">one pedestrian phase at a time</text>

<!-- Wave timer -->
<rect x="380" y="140" width="220" height="90" fill="#eaf6ea" stroke="#2c7a2c" stroke-width="1.5"/>
<text x="490" y="162" text-anchor="middle" font-weight="bold">Green-wave logic</text>
<text x="490" y="180" text-anchor="middle" font-size="11">generic_timer  u_wave_timer</text>
<text x="490" y="196" text-anchor="middle" font-size="11">WAVE_OFFSET = 4 cycles</text>
<text x="490" y="212" text-anchor="middle" font-size="11">wave_active_q gate -> wave_release</text>

<!-- inputs -->
<text x="24" y="100" font-size="10">emergency_override</text>
<path d="M16 104 L16 150 L60 150" fill="none" stroke="#333" marker-end="url(#a)"/>
<path d="M16 104 L16 36 L940 36 L940 160 L920 160" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#a)"/>
<text x="14" y="322" font-size="11">traffic_density_A[2:0]</text>
<line x1="40" y1="305" x2="80" y2="190" stroke="#333" marker-end="url(#a)"/>
<text x="835" y="322" font-size="11">traffic_density_B[2:0]</text>
<line x1="900" y1="305" x2="880" y2="210" stroke="#333" marker-end="url(#a)"/>
<text x="14" y="352" font-size="11">ped_req_A</text><line x1="55" y1="345" x2="120" y2="280" stroke="#333" marker-end="url(#a)"/>
<text x="890" y="350" font-size="11">ped_req_B</text><line x1="900" y1="345" x2="840" y2="280" stroke="#333" marker-end="url(#a)"/>

<!-- ped request/grant -->
<path d="M180 280 L180 370 L380 370" fill="none" stroke="#b36b00" marker-end="url(#a)"/>
<text x="190" y="365" font-size="11" fill="#b36b00">ped_req_pending_A</text>
<path d="M380 392 L240 392 L240 280" fill="none" stroke="#b36b00" marker-end="url(#a)"/>
<text x="250" y="408" font-size="11" fill="#b36b00">ped_grant_A</text>
<path d="M800 280 L800 370 L600 370" fill="none" stroke="#b36b00" marker-end="url(#a)"/>
<text x="640" y="365" font-size="11" fill="#b36b00">ped_req_pending_B</text>
<path d="M600 392 L740 392 L740 280" fill="none" stroke="#b36b00" marker-end="url(#a)"/>
<text x="650" y="408" font-size="11" fill="#b36b00">ped_grant_B</text>

<!-- handshake -->
<path d="M360 150 L380 150" stroke="#2c7a2c" marker-end="url(#a)"/>
<text x="362" y="137" font-size="10" fill="#2c7a2c">A.ns_green_start</text>
<path d="M600 185 L620 185" stroke="#2c7a2c" marker-end="url(#a)"/>
<text x="498" y="245" font-size="10" fill="#2c7a2c">wave_release = B.ns_go</text>
<path d="M770 90 L770 70 L120 70 L120 90" fill="none" stroke="#2c7a2c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="330" y="66" font-size="11" fill="#2c7a2c">B.ns_wait  =  A.ns_go   (A starts NS green only when B is parked)</text>

<!-- outputs -->
<rect x="60" y="460" width="300" height="50" fill="#f4f4f4" stroke="#555"/>
<text x="210" y="480" text-anchor="middle">Junction A lights: ns/ew x red, yellow, green</text>
<text x="210" y="497" text-anchor="middle" font-size="11">+ ped_active_A</text>
<line x1="210" y1="280" x2="210" y2="460" stroke="#333" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="620" y="460" width="300" height="50" fill="#f4f4f4" stroke="#555"/>
<text x="770" y="480" text-anchor="middle">Junction B lights: ns/ew x red, yellow, green</text>
<text x="770" y="497" text-anchor="middle" font-size="11">+ ped_active_B</text>
<line x1="770" y1="280" x2="770" y2="460" stroke="#333" stroke-dasharray="3 3" marker-end="url(#a)"/>

<text x="490" y="545" text-anchor="middle" font-size="11" fill="#444">Legend: blue = traffic control, green = green-wave handshake, orange = pedestrian arbitration. Task 1 (plan) did not show the ns_go / ns_wait handshake or where the density calculation lives.</text>
</svg>
