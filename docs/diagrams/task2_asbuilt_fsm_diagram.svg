<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Arial, Helvetica, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b00020"/></marker></defs>
<rect width="980" height="560" fill="#fff"/>
<text x="490" y="24" text-anchor="middle" font-size="16" font-weight="bold">junction_controller - As-Built Moore FSM (7 states)</text>
<g stroke="#1f5fa8" fill="#e8f1fb" stroke-width="1.5">
<rect x="40" y="90" width="150" height="60" rx="8"/><rect x="260" y="90" width="150" height="60" rx="8"/>
<rect x="480" y="200" width="150" height="60" rx="8" fill="#f4f4f4" stroke="#555"/>
<rect x="700" y="90" width="150" height="60" rx="8"/><rect x="700" y="330" width="150" height="60" rx="8"/>
<rect x="480" y="400" width="150" height="60" rx="8" fill="#fdf1e3" stroke="#b36b00"/>
<rect x="260" y="330" width="150" height="60" rx="8" fill="#f4f4f4" stroke="#555"/>
</g>
<g text-anchor="middle" font-weight="bold">
<text x="115" y="115">S_NS_GREEN</text><text x="335" y="115">S_NS_YELLOW</text><text x="555" y="225">S_ALL_RED</text>
<text x="775" y="115">S_EW_GREEN</text><text x="775" y="355">S_EW_YELLOW</text>
<text x="555" y="425">S_PED_PHASE</text><text x="335" y="355">S_NS_WAIT</text></g>
<g text-anchor="middle" font-size="11">
<text x="115" y="132">NS green / EW red</text><text x="335" y="132">NS yellow / EW red</text>
<text x="555" y="242">all red (reset state)</text><text x="775" y="132">EW green / NS red</text>
<text x="775" y="372">EW yellow / NS red</text><text x="555" y="442">all red, ped_active</text>
<text x="335" y="372">all red, ns_wait=1</text></g>
<g stroke="#333" fill="none" marker-end="url(#a)">
<path d="M190 120 L260 120"/><text x="225" y="112" font-size="10" stroke="none" fill="#333" text-anchor="middle">done</text>
<path d="M410 125 Q470 160 495 200"/><text x="470" y="160" font-size="10" stroke="none" fill="#333">done (ret_ew=1)</text>
<path d="M630 215 Q700 190 720 150"/><text x="690" y="205" font-size="10" stroke="none" fill="#333">done, ret_ew=1</text>
<path d="M775 150 L775 330"/><text x="782" y="245" font-size="10" stroke="none" fill="#333">done</text>
<path d="M700 375 Q620 340 600 262"/><text x="670" y="330" font-size="10" stroke="none" fill="#333">done (ret_ew=0)</text>
<path d="M530 260 L545 400"/><text x="440" y="320" font-size="10" stroke="none" fill="#333">done &amp; ped_pending &amp; grant</text>
<path d="M480 235 Q380 235 335 330"/><text x="350" y="262" font-size="10" stroke="none" fill="#333">done, ret_ew=0, !ns_go</text>
<path d="M480 440 Q300 440 285 390"/><text x="300" y="430" font-size="10" stroke="none" fill="#333">done, ret_ew=0, !ns_go</text>
<path d="M260 345 Q120 330 95 150"/><text x="110" y="300" font-size="10" stroke="none" fill="#333">ns_go</text>
<path d="M500 200 Q250 190 160 150"/><text x="250" y="190" font-size="10" stroke="none" fill="#333">done, ret_ew=0, ns_go</text>
</g>
<g stroke="#b00020" fill="none" marker-end="url(#r)" stroke-width="1.5">
<path d="M555 460 L555 505 L920 505 L920 230 L630 230" stroke-dasharray="5 3"/></g>
<text x="920" y="540" text-anchor="end" font-size="11" fill="#b00020">emergency_override = 1: ANY state -> S_ALL_RED next clock;</text><text x="920" y="554" text-anchor="end" font-size="11" fill="#b00020">timer restarted each cycle, ped phase aborted</text>
<g font-size="11" fill="#333">
<text x="640" y="445" font-size="11" fill="#333">PED done -> ret_dest: EW_GREEN (ret_ew=1),</text><text x="640" y="460" font-size="11" fill="#333">else NS_GREEN (ns_go) / NS_WAIT (!ns_go)</text>
<text x="40" y="500">Reset (sync, active-high): S_ALL_RED.</text>
<text x="40" y="517">Every phase lasts exactly *_TIME clocks: timer loaded with TIME-1 (TIMER_LATENCY = 1).</text>
<text x="40" y="534" font-size="10.5">NS/EW green = clamp(GREEN_TIME + density x GREEN_EXT_STEP, MIN, MAX); density sampled once at entry.</text>
<text x="40" y="551">S_NS_GREEN entry gated by ns_go (green wave); otherwise park in S_NS_WAIT. Default case -> S_ALL_RED.</text></g>
</svg>
